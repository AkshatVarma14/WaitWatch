# =============================================================================
# WaitWatch — Container Infrastructure (Docker Compose)
# =============================================================================
# Production scaffolding and local verification stack for WaitWatch:
# - PostgreSQL 16 with PostGIS 3.4 spatial database (db)
# - Database migration one-shot runner (migrate)
# - FastAPI async backend API (api)
# - React SPA served via Nginx with API reverse proxy (web)
#
# Quickstart:
#   1. Copy configuration template and configure credentials:
#      cp .env.example .env
#   2. Start the full stack:
#      docker compose up -d --build
#   3. View service status:
#      docker compose ps
#   4. View logs:
#      docker compose logs -f api
#   5. Stop the stack:
#      docker compose down
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Database: PostgreSQL 16 with PostGIS 3.4
  # ---------------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: waitwatch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waitwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-waitwatch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - waitwatch-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waitwatch} -d ${POSTGRES_DB:-waitwatch}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # 2. Database Migration Runner: One-shot Alembic migration execution
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: waitwatch-api:0.1.0
    container_name: waitwatch-migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 3. Backend: FastAPI async REST API
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: waitwatch-api:0.1.0
    container_name: waitwatch-api
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:80,http://127.0.0.1:3000,http://127.0.0.1:5173}
      DELHI_TRANSIT_API_KEY: ${DELHI_TRANSIT_API_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # 4. Frontend: React SPA served by Nginx with reverse proxy to API
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
        VITE_POLLING_INTERVAL_SEC: ${VITE_POLLING_INTERVAL_SEC:-30}
    image: waitwatch-web:0.1.0
    container_name: waitwatch-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 3s

volumes:
  waitwatch-pgdata:
